name: Pages

# Publishes the build to GitHub Pages (https://tkjaer.github.io/how-the-internet-works/) on every push to main, and by
# hand. While the repo is private both jobs are skipped: the site goes up with the flip to public. Needs Settings ›
# Pages › Source: GitHub Actions. The build is relative (vite.config.ts), so the same dist/ works on a custom domain;
# og:url and og:image come from .env.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time; a newer push waits for the one under way rather than cancelling it half done
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
