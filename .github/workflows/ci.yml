name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Where the jobs run follows the repo's visibility, so nothing changes by hand when it goes public:
# - private: the self-hosted runners on the lab PC (label `lab`, two of them so day and night run side by side), the
#   a11y jobs with the PC's GPU (/dev/dri, drawn through Mesa). Self-hosted runners cost no Actions minutes.
# - public: GitHub's hosted runners (free for public repos), the a11y jobs on the software renderer (SWIFTSHADER,
#   about 15–20 min a job). A public repo's PRs, from forks too, never reach the lab runners.
# Both run inside the Playwright image, which brings Chromium and its fonts and libraries (the app's own fonts are
# bundled). Its tag is package-lock's `playwright` version, read by the `playwright` job, so a Playwright bump brings
# the matching image with it; one that lands before Microsoft publishes the image fails the pull until it appears
# (usually the same day).
jobs:
  playwright:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","lab"]') || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # into its own directory: this job runs outside the image, and on the lab the workspace holds root-owned files
      # from the jobs inside it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
          path: lockfile
      # plain awk, as the lab's own PATH may have no node or jq; checked, as it goes into the image name
      - id: version
        run: |
          version=$(awk -F'"' '
            $2 == "node_modules/playwright" { f = 1; next }
            f && $2 == "version" { print $4; exit }
            f && /}/ { exit }
          ' lockfile/package-lock.json)
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=package-lock.json::No x.y.z playwright version to tag the image with (found '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: playwright
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","lab"]') || 'ubuntu-latest' }}
    container: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # the same dist/ under a sub-path, as GitHub Pages serves it (evaluate serves it itself)
      - name: Under a sub-path
        run: npm run evaluate -- --only=subpath
        env:
          SWIFTSHADER: '1'
          EVALUATE_NO_LOCK: '1'

  a11y:
    name: a11y (${{ matrix.mode }})
    # on PRs (and by hand); a push to main is a PR that already passed it on the latest main
    if: github.event_name != 'push'
    needs: playwright
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","lab"]') || 'ubuntu-latest' }}
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      # the lab PC's Intel GPU (Mesa): about 3× faster than the software renderer; hosted runners have none
      options: ${{ github.event.repository.private && '--device /dev/dri' || '' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [day, night]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Serve the build
        run: |
          npx vite preview --host 127.0.0.1 --port 5318 --strictPort &
          for _ in $(seq 30); do node -e "fetch('http://127.0.0.1:5318/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && exit 0; sleep 1; done; exit 1
      - name: Accessibility, ${{ matrix.mode }}
        run: npm run evaluate -- --only=a11y --mode="$MODE"
        env:
          MODE: ${{ matrix.mode }}
          # no GPU on a hosted runner: Chrome's software renderer, as evaluate's renderer line will say
          SWIFTSHADER: ${{ !github.event.repository.private && '1' || '' }}
          EVALUATE_NO_LOCK: '1'
